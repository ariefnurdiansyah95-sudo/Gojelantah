<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — GoJelantah</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #0b2a1d 0%, #06150f 100%);
    color: #eafff3;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    max-width: 420px;
    padding: 32px;
    text-align: center;
  }
  .icon {
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, #16be91, #045a4e);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.5);
  }
  .icon svg { width: 40px; height: 40px; }
  h1 {
    font-size: 22px;
    margin: 0 0 10px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #b7d8c8;
    margin: 0 0 24px;
  }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 12px 24px;
    border-radius: 999px;
    background: linear-gradient(135deg, #16be91, #0a8f6f);
    color: #06150f;
    font-weight: 700;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="white"><path d="M12 2c-4 5.5-7 9-7 13a7 7 0 0 0 14 0c0-4-3-7.5-7-13z"/></svg>
    </div>
    <h1>Lagi offline</h1>
    <p>Sepertinya koneksi internet kamu lagi terputus. Cek lagi sinyal/Wi-Fi kamu, lalu coba muat ulang halaman ini.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
